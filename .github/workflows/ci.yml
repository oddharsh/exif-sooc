name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      # The xtask binary is what the corpus test shells out to, and building
      # the workspace is what makes it exist.
      - run: cargo build --release --workspace
      - run: cargo test --release
      # The synthetic tests run everywhere. Agreement with ExifTool needs
      # photographs, which do not ship with the crate, so that suite is opt-in
      # through EXIF_SOOC_CORPUS and skips here.

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --workspace -- -D warnings
