[workspace]
members = [".", "xtask"]

# The library and binary stay dependency-free. `xtask` is where the tools that
# need help live: parsing Perl wants a regex engine, and comparing against
# ExifTool wants a JSON reader, and neither belongs in what a consumer installs.
# Nothing under xtask/ ships.

[package]
name = "exif-sooc"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Read camera metadata, and Fujifilm film recipes, out of SOOC files without reading the whole file"
license = "MIT"
repository = "https://github.com/oddharsh/exif-sooc"
keywords = ["exif", "metadata", "fujifilm", "heif", "photography"]
categories = ["multimedia::images", "command-line-utilities"]

# No dependencies, on purpose. Everything here is byte layout and lookup
# tables, so a dependency would buy nothing and cost build time, binary size
# and a supply chain.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
